<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatbot tester walkthrough</title>
<style>
  :root {
    --ink: #16261f;
    --ink-soft: #4a5a52;
    --ink-faint: #7c8b83;
    --paper: #f6f4ee;
    --card: #ffffff;
    --line: #dcd8cc;
    --teal: #0f6e56;
    --teal-soft: #e1f0ea;
    --amber: #a5670b;
    --amber-soft: #faeeda;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #eef1ee;
      --ink-soft: #b7c2bb;
      --ink-faint: #7f8d85;
      --paper: #12211b;
      --card: #182a22;
      --line: #2c3d34;
      --teal: #4ecba0;
      --teal-soft: #1c3a30;
      --amber: #e3ad57;
      --amber-soft: #3a2d14;
    }
  }
  :root[data-theme="dark"] {
    --ink: #eef1ee; --ink-soft: #b7c2bb; --ink-faint: #7f8d85;
    --paper: #12211b; --card: #182a22; --line: #2c3d34;
    --teal: #4ecba0; --teal-soft: #1c3a30; --amber: #e3ad57; --amber-soft: #3a2d14;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 8px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 22px; max-width: 46ch; }
  .progress-row { display: flex; gap: 8px; margin-bottom: 24px; }
  .progress-seg { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .progress-seg > div { height: 100%; width: 0%; background: var(--teal); transition: width .25s ease; }
  details.settings {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 22px;
  }
  details.settings > summary {
    cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink-soft);
    list-style: none; display: flex; align-items: center; justify-content: space-between;
  }
  details.settings > summary::-webkit-details-marker { display: none; }
  .field { margin-top: 12px; }
  .field label { display: block; font-size: 12px; color: var(--ink-faint); margin-bottom: 4px; }
  .field input {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 14px;
  }
  .field input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 18px 16px; margin-bottom: 18px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .card-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .badge {
    font-size: 12px; padding: 3px 9px; border-radius: 20px; font-weight: 600;
    background: var(--teal-soft); color: var(--teal); white-space: nowrap;
  }
  .badge.warn { background: var(--amber-soft); color: var(--amber); }
  .card-note { font-size: 13px; color: var(--ink-soft); margin: 4px 0 14px; }

  .open-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600;
    color: var(--teal); text-decoration: none; padding: 8px 0; margin-bottom: 10px;
  }
  .msg-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
  .msg-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
  }
  .msg-row input[type="checkbox"] { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--teal); flex-shrink: 0; }
  .msg-text { flex: 1; font-size: 14px; }
  .copy-btn {
    flex-shrink: 0; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    font-size: 12px; padding: 6px 10px; border-radius: 7px; cursor: pointer;
  }
  .copy-btn:active { transform: scale(0.97); }
  .copy-btn.copied { color: var(--teal); border-color: var(--teal); }

  .survey-btn {
    display: block; width: 100%; text-align: center; margin-top: 14px; padding: 11px;
    border-radius: 10px; border: none; background: var(--line); color: var(--ink-faint);
    font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  .survey-btn.ready { background: var(--teal); color: #fff; }

  footer { text-align: center; font-size: 12px; color: var(--ink-faint); padding: 20px 20px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Chatbot tester walkthrough</h1>
  <p class="sub">Try both chatbots. For each one, send the six messages below (tap copy, paste it in), check each off, then fill the short survey for that chatbot. It takes about 10 to 15 minutes in total.</p>

  <div class="progress-row" id="progressRow"></div>

  <div id="cards"></div>

  <footer>Progress is saved on this device only.</footer>
</div>

<script>
// ---- EDIT THESE, THEN REDEPLOY ----
const CONFIG = {
  surveyLink: "https://forms.gle/wm95apGkYanHuoZU7",
  chatLinks: { A: "https://0bf71b14105da2a654.gradio.live", B: "https://4d7aefc0000f1fa8cb.gradio.live" }   // paste each chatbot's link between the quotes
};
// -----------------------------------

const MESSAGES = [
  "Hi! I'm vegetarian and trying to eat healthier — can you suggest a simple daily diet plan with vegetarian options?",
  "My favorite cuisine is Italian — can you suggest a full 3-course Italian menu for me?",
  "I'm setting up a smart home in a 2-bedroom apartment with a budget of around $300 — can you suggest a starter kit?",
  "Can you help me improve this resume bullet: \"Worked on the marketing team\"?",
  "Explain how compound interest works.",
  "wehre is my odrer nubmer 4521"
];

const BOTS = [
  { id: "A", name: "Chatbot A — Llama 3.1", formLabel: "Chatbot A (Llama 3.1 8B)", note: null },
  { id: "B", name: "Chatbot B — Mistral", formLabel: "Chatbot B (Mistral 7B)", note: null }
];

function load(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : JSON.parse(v);
  } catch (e) { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}


function checkedState(botId) {
  return load("checks_" + botId, new Array(MESSAGES.length).fill(false));
}
function setChecked(botId, arr) {
  save("checks_" + botId, arr);
}

function renderProgress() {
  const row = document.getElementById("progressRow");
  row.innerHTML = "";
  BOTS.forEach(bot => {
    const done = checkedState(bot.id).filter(Boolean).length;
    const pct = Math.round((done / MESSAGES.length) * 100);
    const seg = document.createElement("div");
    seg.className = "progress-seg";
    seg.innerHTML = '<div style="width:' + pct + '%"></div>';
    row.appendChild(seg);
  });
}

function renderCards() {
  const container = document.getElementById("cards");
  container.innerHTML = "";
  BOTS.forEach(bot => {
    const checks = checkedState(bot.id);
    const allDone = checks.every(Boolean);
    const link = CONFIG.chatLinks[bot.id];
    const surveyLink = CONFIG.surveyLink;

    const card = document.createElement("div");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = '<h2>' + bot.name + '</h2><span class="badge' + (allDone ? '' : ' warn') + '">' +
      checks.filter(Boolean).length + ' of ' + MESSAGES.length + '</span>';
    card.appendChild(head);

    if (bot.note) {
      const note = document.createElement("p");
      note.className = "card-note";
      note.textContent = bot.note;
      card.appendChild(note);
    }

    const openBtn = document.createElement("a");
    openBtn.className = "open-btn";
    openBtn.textContent = link ? "Open this chatbot in a new tab" : "Chatbot link will be shared by the team";
    openBtn.href = link || "#";
    openBtn.target = "_blank";
    openBtn.rel = "noopener";
    if (!link) {
      openBtn.style.opacity = "0.5";
      openBtn.addEventListener("click", e => e.preventDefault());
    }
    card.appendChild(openBtn);

    const list = document.createElement("div");
    list.className = "msg-list";
    MESSAGES.forEach((msg, i) => {
      const row = document.createElement("div");
      row.className = "msg-row";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = checks[i];
      cb.addEventListener("change", () => {
        const c = checkedState(bot.id);
        c[i] = cb.checked;
        setChecked(bot.id, c);
        renderProgress();
        renderCards();
      });

      const text = document.createElement("div");
      text.className = "msg-text";
      text.textContent = (i + 1) + ". " + msg;

      const copyBtn = document.createElement("button");
      copyBtn.className = "copy-btn";
      copyBtn.textContent = "Copy";
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(msg);
          copyBtn.textContent = "Copied";
          copyBtn.classList.add("copied");
          setTimeout(() => { copyBtn.textContent = "Copy"; copyBtn.classList.remove("copied"); }, 1400);
        } catch (e) {
          copyBtn.textContent = "Select text";
        }
      });

      row.appendChild(cb);
      row.appendChild(text);
      row.appendChild(copyBtn);
      list.appendChild(row);
    });
    card.appendChild(list);

    const surveyBtn = document.createElement("a");
    surveyBtn.className = "survey-btn" + (allDone ? " ready" : "");
    surveyBtn.textContent = allDone ? "Take the survey for this chatbot" : "Finish all 6 to unlock the survey";
    surveyBtn.href = allDone && surveyLink ? surveyLink : "#";
    if (allDone && surveyLink) {
      surveyBtn.target = "_blank";
      surveyBtn.rel = "noopener";
    } else {
      surveyBtn.addEventListener("click", e => e.preventDefault());
    }
    card.appendChild(surveyBtn);
    const hint = document.createElement("p");
    hint.className = "card-note";
    hint.style.margin = "8px 0 0";
    hint.textContent = 'In the form, pick "' + bot.formLabel + '" for the first question.';
    card.appendChild(hint);

    container.appendChild(card);
  });
}


renderProgress();
renderCards();
</script>
</body>
</html>
